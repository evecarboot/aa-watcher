# Docker Compose overlay for aa-intel-watcher's media server.
#
# This adds MediaMTX as its own container on the SAME docker-compose project
# as your Alliance Auth stack, so it can reach the `allianceauth_gunicorn`
# container by service name (Docker's built-in DNS) and be reached by the
# `nginx` container the same way - no host networking/127.0.0.1 involved.
# (Running MediaMTX as a SEPARATE compose project instead? Then both
# projects must join a shared external network - see TROUBLESHOOTING.md.
# Verify with: docker inspect mediamtx --format '{{json .NetworkSettings.Networks}}')
#
# The `deploy/` directory must sit next to your Alliance Auth
# docker-compose.yml (copy it there from this repo) - relative paths below
# resolve against the compose project directory.
#
# Before running this, put the two secrets in a `.env` file next to your
# docker-compose.yml (each generated separately with `openssl rand -hex 32`):
#   INTEL_WATCHER_MEDIAMTX_SECRET=<same value as in local.py>
#   INTEL_WATCHER_HLS_CDN_SECRET=<same value as local.py + the nginx Bearer
#                                 header - see the nginx snippet>
#
# IMPORTANT: add `allianceauth_gunicorn` to ALLOWED_HOSTS in local.py.
# MediaMTX's publish-auth POSTs carry "Host: allianceauth_gunicorn" - if
# Django rejects the host, every OBS publish is denied (see README).
#
# Usage (run from the same directory as your Alliance Auth docker-compose.yml):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.mediamtx.yml up -d
#
# Or merge both service blocks below directly into your existing
# docker-compose.yml if you'd rather not juggle two `-f` flags.

services:
  # One-shot helper: substitutes INTEL_WATCHER_MEDIAMTX_SECRET into
  # deploy/mediamtx-docker.yml and writes the result to ./conf/mediamtx.yml.
  # (Note the generated file contains the plaintext secret - it's already
  # written to ./conf/ alongside your other compose configs; keep it out of
  # git.)
  #
  # no more manually copying/editing that file or keeping the secret in sync
  # by hand. Re-runs (and overwrites ./conf/mediamtx.yml) on every `up`, so
  # make other edits in deploy/mediamtx-docker.yml, not ./conf/mediamtx.yml.
  mediamtx-config:
    image: alpine:3.20
    container_name: mediamtx-config
    restart: "no"
    environment:
      - INTEL_WATCHER_MEDIAMTX_SECRET=${INTEL_WATCHER_MEDIAMTX_SECRET:?Set INTEL_WATCHER_MEDIAMTX_SECRET in a .env file next to this docker-compose.yml first (same value as in local.py) - see README.md}
      - INTEL_WATCHER_HLS_CDN_SECRET=${INTEL_WATCHER_HLS_CDN_SECRET:?Set INTEL_WATCHER_HLS_CDN_SECRET in a .env file next to this docker-compose.yml first (openssl rand -hex 32, same value as local.py and the nginx Bearer header) - see README.md}
    volumes:
      - ./deploy/mediamtx-docker.yml:/template/mediamtx.yml:ro
      - ./conf:/out
    command:
      - sh
      - -c
      # Plain-string substitution via awk+ENVIRON - no regex/sed escaping,
      # so secrets containing &, \, # or quotes can't corrupt the YAML. Each
      # distinct placeholder appears only at its intended value position, so
      # secrets never end up inside comment text in the generated file.
      - awk '{ s=ENVIRON["INTEL_WATCHER_MEDIAMTX_SECRET"]; c=ENVIRON["INTEL_WATCHER_HLS_CDN_SECRET"]; out=""; rest=$$0; while ((i=index(rest,"__WEBHOOK_SECRET__"))>0){ out=out substr(rest,1,i-1) s; rest=substr(rest,i+18) } while ((i=index(rest,"__HLS_CDN_SECRET__"))>0){ out=out substr(rest,1,i-1) c; rest=substr(rest,i+18) } print out rest }' /template/mediamtx.yml > /out/mediamtx.yml && echo "Wrote ./conf/mediamtx.yml"

  mediamtx:
    # NOT the stock image: bluenviron/mediamtx is scratch-based and has no
    # curl, so the runOnUnavailable hook could never run. The Dockerfile
    # builds alpine + curl + the pinned mediamtx binary.
    build:
      context: ./deploy
      dockerfile: Dockerfile.mediamtx
      args:
        MEDIAMTX_VERSION: "1.21.1"
    image: aa-intel-watcher-mediamtx:1.21.1
    container_name: mediamtx
    restart: always
    depends_on:
      mediamtx-config:
        condition: service_completed_successfully
    volumes:
      - ./conf/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # RTMP - OBS needs to reach this directly, so it's published to the
      # host/public interface. Prefer restricting this to your corp's VPN
      # or a security group rule if streamers connect over one. If the
      # Alliance Auth web hostname is proxied (Cloudflare etc.), publish a
      # dedicated DNS-only hostname for this server and set
      # INTEL_WATCHER_RTMP_HOST - see README "Two hostnames".
      - "1935:1935"
      # Deliberately NOT publishing 8888 (HLS) here - only the `nginx`
      # container (and allianceauth_gunicorn, for liveness checks if you set
      # INTEL_WATCHER_HLS_INTERNAL_URL) should ever reach it, over the
      # internal docker network.
    logging:
      driver: "json-file"
      options:
        max-size: "10Mb"
        max-file: "5"
