# MediaMTX config sample for aa-intel-watcher (bare metal).
# Install MediaMTX from https://github.com/bluenviron/mediamtx/releases
# (tested with v1.21.x) and place this file at e.g.
# /etc/mediamtx/mediamtx.yml, run as a systemd service.
#
# RTMP (1935) must be reachable by streamers' OBS clients. Everything else
# is bound to localhost so the only public-facing entry point is nginx
# (see nginx-intel-watcher.conf). If you change rtmpAddress, keep the other
# *_Address values locked to 127.0.0.1.
#
# If your Alliance Auth website hostname is behind a proxy/CDN that only
# forwards HTTP(S) (e.g. Cloudflare), it cannot accept this RTMP traffic -
# create a dedicated DNS record pointing DIRECTLY at this host (Cloudflare:
# "DNS only", not proxied) and set INTEL_WATCHER_RTMP_HOST to it in
# local.py, or OBS will be handed a hostname it can't connect to.

rtmpAddress: :1935

# Unused protocols are disabled so their default listeners never get
# exposed. aa_intel_watcher only needs RTMP (publish) and HLS (viewing).
rtsp: no
webrtc: no
srt: no
moq: no

hls: yes
# localhost only - nginx (not browsers) talks to MediaMTX directly.
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsAllowOrigins: ["*"]

# Backend gate for the HLS endpoint itself. When set, MediaMTX only serves
# playlists/segments to requests carrying "Authorization: Bearer <secret>".
# nginx injects that header on its proxy_pass (see
# nginx-intel-watcher.conf), so authorised viewers still work
# transparently - but a direct hit on :8888 is rejected, and MediaMTX's
# cookieCheck redirect dance (which breaks behind the auth_request proxy:
# the child playlist comes back 401) is bypassed for Bearer-authenticated
# requests.
#
# Replace the placeholder below with a dedicated secret
# (openssl rand -hex 32) and use the SAME value in the nginx
# `proxy_set_header Authorization`
# line and in local.py's INTEL_WATCHER_HLS_CDN_SECRET (so the app's
# liveness probe keeps working). It is a DIFFERENT secret from
# INTEL_WATCHER_MEDIAMTX_SECRET - that one authenticates MediaMTX ->
# Alliance Auth unpublish calls; this one authenticates nginx -> MediaMTX
# HLS reads.
hlsCDNSecret: __HLS_CDN_SECRET__

# Every publish attempt (OBS connecting) is validated against Alliance Auth.
# MediaMTX POSTs JSON {user, password, ip, action, path, protocol, id, ...}
# and accepts the action on any 2xx response.
#
# IMPORTANT: Django validates the Host header against ALLOWED_HOSTS. MediaMTX
# sends "Host: 127.0.0.1:8000" here, so 127.0.0.1 must be in ALLOWED_HOSTS
# in Alliance Auth's local.py, or every publish will be rejected with a 400
# (TCP 1935 connects fine but OBS "fails to connect").
authMethod: http
authHTTPAddress: http://127.0.0.1:8000/intel-watcher/hooks/publish-auth/

paths:
  all:
    # Notify Alliance Auth when a streamer stops, so the page stops showing
    # them as live. Replace the webhook secret placeholder below with the
    # value you set for INTEL_WATCHER_MEDIAMTX_SECRET in Alliance Auth's
    # local settings.
    #
    # Requires curl on the host (present on any normal Linux install - the
    # stock Docker image is scratch and has NO curl, see
    # deploy/Dockerfile.mediamtx).
    #
    # runOnUnavailable env vars include MTX_PATH and MTX_SOURCE_ID (the
    # publisher connection's UUID, same as the `id` field sent to the auth
    # endpoint). source_id lets the app ignore stale callbacks when a
    # streamer reconnects quickly.
    # -sS stays quiet on success but still prints errors (DNS, refused,
    # timeout) to MediaMTX's log - a silently failing hook is exactly how
    # "stream stops but is_live stays True" goes unnoticed.
    runOnUnavailable: >
      curl -sS --max-time 10 -X POST http://127.0.0.1:8000/intel-watcher/hooks/unpublish/
      -H "X-Webhook-Secret: __WEBHOOK_SECRET__"
      --data-urlencode "path=$MTX_PATH"
      --data-urlencode "source_id=$MTX_SOURCE_ID"
