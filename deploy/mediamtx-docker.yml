# MediaMTX config sample for aa-intel-watcher - DOCKER variant.
# Mount this at ./conf/mediamtx.yml (matching the volume in
# docker-compose.mediamtx.yml) in your Alliance Auth docker-compose project.
#
# The only difference from deploy/mediamtx.yml (bare metal) is that Alliance
# Auth is reached via its Docker Compose service name (`allianceauth_gunicorn`)
# instead of 127.0.0.1, since MediaMTX now runs in its own container on the
# same docker-compose network.

rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 4
hlsSegmentDuration: 1s
# Fine to leave open - only the `nginx` container (not browsers) ever
# reaches this address directly.
hlsAllowOrigin: "*"

# Every publish attempt (OBS connecting) is validated against Alliance Auth.
authMethod: http
authHTTPAddress: http://allianceauth_gunicorn:8000/intel-watcher/hooks/publish-auth/

paths:
  all:
    # Notify Alliance Auth when a streamer stops, so the page stops showing
    # them as live. Replace CHANGE_ME with the value you set for
    # INTEL_WATCHER_MEDIAMTX_SECRET in Alliance Auth's local settings.
    runOnUnpublish: >
      curl -s -X POST http://allianceauth_gunicorn:8000/intel-watcher/hooks/unpublish/
      -H "X-Webhook-Secret: CHANGE_ME"
      --data-urlencode "path=$MTX_PATH"
    runOnUnpublishRestart: no
