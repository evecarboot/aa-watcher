# MediaMTX config template for aa-intel-watcher - DOCKER variant.
#
# You don't need to copy or edit this file by hand: the `mediamtx-config`
# helper container in docker-compose.mediamtx.yml reads this file, replaces
# CHANGE_ME with your INTEL_WATCHER_MEDIAMTX_SECRET (from .env), and writes
# the result to ./conf/mediamtx.yml automatically on every `docker compose
# up`. Edit this template if you need to change anything else about
# MediaMTX's config.
#
# The only difference from deploy/mediamtx.yml (bare metal) is that Alliance
# Auth is reached via its Docker Compose service name (`allianceauth_gunicorn`)
# instead of 127.0.0.1, since MediaMTX now runs in its own container on the
# same docker-compose network.

rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 4
hlsSegmentDuration: 1s
# Fine to leave open - only the `nginx` container (not browsers) ever
# reaches this address directly.
hlsAllowOrigins: ["*"]

# Every publish attempt (OBS connecting) is validated against Alliance Auth.
authMethod: http
authHTTPAddress: http://allianceauth_gunicorn:8000/intel-watcher/hooks/publish-auth/

paths:
  all:
    # Notify Alliance Auth when a streamer stops, so the page stops showing
    # them as live. CHANGE_ME is filled in automatically from your .env's
    # INTEL_WATCHER_MEDIAMTX_SECRET by the mediamtx-config helper container -
    # it must match the value set in Alliance Auth's local.py.
    #
    # NOTE: MediaMTX renamed this hook from runOnUnpublish to runOnUnavailable
    # (formerly runOnNotReady before that) - there's no separate "Restart"
    # flag for it since it's a one-shot notification, not a long-running command.
    runOnUnavailable: >
      curl -s -X POST http://allianceauth_gunicorn:8000/intel-watcher/hooks/unpublish/
      -H "X-Webhook-Secret: CHANGE_ME"
      --data-urlencode "path=$MTX_PATH"
