# MediaMTX config template for aa-intel-watcher - DOCKER variant.
#
# You don't need to copy or edit this file by hand: the `mediamtx-config`
# helper container in docker-compose.mediamtx.yml reads this file,
# substitutes the webhook secret and the HLS CDN secret from your .env into
# the two placeholder values below, and writes the result to
# ./conf/mediamtx.yml automatically on every `docker compose up`. Edit this
# template if you need to change anything else about MediaMTX's config.
#
# The differences from deploy/mediamtx.yml (bare metal):
#  * Alliance Auth is reached via its Docker Compose service name
#    (`allianceauth_gunicorn`) instead of 127.0.0.1, since MediaMTX runs in
#    its own container on the same docker-compose network.
#  * hlsAddress stays bound to all interfaces - the port is never published
#    to the host, only reachable from other containers on the compose
#    network (the `nginx` container, and the app for liveness checks).
#
# RTMP (1935) is published to the host by docker-compose.mediamtx.yml. If
# your Alliance Auth website hostname is behind a proxy/CDN that only
# forwards HTTP(S) (e.g. Cloudflare), it cannot accept RTMP - create a
# dedicated DNS record pointing DIRECTLY at this host (Cloudflare: "DNS
# only", not proxied) and set INTEL_WATCHER_RTMP_HOST to it in local.py, or
# OBS will be handed a hostname it can't connect to.

rtmpAddress: :1935

# Unused protocols are disabled so their default listeners never accept
# traffic. aa_intel_watcher only needs RTMP (publish) and HLS (viewing).
rtsp: no
webrtc: no
srt: no
moq: no

hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsAllowOrigins: ["*"]

# Backend gate for the HLS endpoint itself. When set, MediaMTX only serves
# playlists/segments to requests carrying "Authorization: Bearer <secret>".
# nginx injects that header on its proxy_pass (see the nginx snippets), so
# authorised viewers still work transparently - but a direct hit on :8888
# from anything else is rejected, and MediaMTX's cookieCheck redirect
# dance (which breaks behind the auth_request proxy: the child playlist
# comes back 401) is bypassed for Bearer-authenticated requests.
#
# The placeholder value below is filled in automatically from your .env's
# INTEL_WATCHER_HLS_CDN_SECRET by the mediamtx-config helper - it must be
# the same value used in the nginx `proxy_set_header Authorization` line.
# It is a DIFFERENT secret from INTEL_WATCHER_MEDIAMTX_SECRET (that one
# authenticates MediaMTX -> Alliance Auth unpublish calls; this one
# authenticates nginx -> MediaMTX HLS reads). Generate it separately with
# `openssl rand -hex 32`.
hlsCDNSecret: __HLS_CDN_SECRET__

# Every publish attempt (OBS connecting) is validated against Alliance Auth.
# MediaMTX POSTs JSON {user, password, ip, action, path, protocol, id, ...}
# and accepts the action on any 2xx response.
#
# IMPORTANT: Django validates the Host header against ALLOWED_HOSTS. MediaMTX
# sends "Host: allianceauth_gunicorn:8000" here, so "allianceauth_gunicorn"
# must be in ALLOWED_HOSTS in local.py (or add a plain-ASCII network alias
# like `intelwatcher-auth` to the allianceauth_gunicorn service, add that to
# ALLOWED_HOSTS, and use it here instead). If it isn't, MediaMTX gets a 400
# DisallowedHost and rejects every publish - TCP 1935 connects fine but OBS
# "fails to connect".
authMethod: http
authHTTPAddress: http://allianceauth_gunicorn:8000/intel-watcher/hooks/publish-auth/

paths:
  all:
    # Notify Alliance Auth when a streamer stops, so the page stops showing
    # them as live. The webhook secret placeholder below is filled in
    # automatically from your .env's INTEL_WATCHER_MEDIAMTX_SECRET by the
    # mediamtx-config helper container - it must match the value set in
    # Alliance Auth's local.py.
    #
    # NOTE: the stock bluenviron/mediamtx image is `scratch`-based and has
    # no curl - the compose overlay builds a small alpine+curl image for
    # this reason (see deploy/Dockerfile.mediamtx).
    #
    # runOnUnavailable env vars include MTX_PATH and MTX_SOURCE_ID (the
    # publisher connection's UUID, same as the `id` field sent to the auth
    # endpoint). source_id lets the app ignore stale callbacks when a
    # streamer reconnects quickly.
    # -sS stays quiet on success but still prints errors (DNS, refused,
    # timeout) to MediaMTX's log - a silently failing hook is exactly how
    # "stream stops but is_live stays True" goes unnoticed.
    runOnUnavailable: >
      curl -sS --max-time 10 -X POST http://allianceauth_gunicorn:8000/intel-watcher/hooks/unpublish/
      -H "X-Webhook-Secret: __WEBHOOK_SECRET__"
      --data-urlencode "path=$MTX_PATH"
      --data-urlencode "source_id=$MTX_SOURCE_ID"
