# Sample nginx config snippet for aa-intel-watcher (bare metal).
# Add this inside the existing `server {}` block that already serves your
# Alliance Auth site (the one terminating TLS on your public domain).
#
# This makes sure the HLS video segments themselves are only served to
# users who are currently logged in to Alliance Auth with the
# `aa_intel_watcher.basic_access` permission - not just the page around
# them. Without this, anyone with the (guessable) HLS URL could watch
# without logging in.

location = /intel-watcher/_auth_check/ {
    internal;
    # Lightweight endpoint returning 204 (allowed) or 401 (denied) - see
    # deploy/urls.py. Do NOT point auth_request at a login_required view:
    # the 302 login redirect would turn into a 500 for the HLS request.
    proxy_pass http://127.0.0.1:8000/intel-watcher/hls-auth/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # Forward the real public Host so Django's ALLOWED_HOSTS check passes,
    # and the session cookie so the permission check can see the user.
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

location /hls/ {
    auth_request /intel-watcher/_auth_check/;
    # auth_request treats 2xx as allow and 401/403 as deny; anything else
    # (e.g. a redirect) becomes a 500 for the client.
    proxy_pass http://127.0.0.1:8888/;
    # MediaMTX's hlsCDNSecret requires every HLS request to carry this
    # backend credential - nginx alone injects it, the browser never sees
    # it. Use the SAME value as hlsCDNSecret in mediamtx.yml (replace the
    # placeholder; generate with `openssl rand -hex 32`). Without it the
    # master playlist may load but the child playlist/segments 401.
    proxy_set_header Authorization "Bearer __HLS_CDN_SECRET__";
    # MediaMTX answers the first HLS request of a session with a relative
    # redirect (Location: /live/<key>/index.m3u8?cookieCheck=1). Rewrite it
    # back under /hls/ on the public https host or the browser will 404 on
    # /live/... or block the http:// variant as mixed content. (With
    # hlsCDNSecret set, Bearer-authenticated requests usually get a direct
    # 200 - this stays as a safety net for the cookie flow.)
    proxy_redirect ~^(?:https?://[^/]+)?/(.*)$ https://$host/hls/$1;
    # Segments must not end up in any shared/public cache - they're behind
    # Alliance Auth permissions.
    add_header Cache-Control "private, no-store" always;
}
