[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-intel-watcher"
version = "0.3.0"
description = "Alliance Auth app: corp/alliance-only OBS intel streaming page with live chat"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "allianceauth>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["aa_intel_watcher*"]

# Without this, the wheel/sdist only contains .py files and a pip-installed
# copy of the app has no templates or static assets at all.
[tool.setuptools.package-data]
aa_intel_watcher = [
    "templates/aa_intel_watcher/*",
    "static/aa_intel_watcher/css/*",
    "static/aa_intel_watcher/js/*",
]
